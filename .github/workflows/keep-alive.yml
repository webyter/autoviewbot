name: Keep Alive

# Render's free web services spin down after 15 minutes without inbound
# traffic. The app pings its own public URL (see lib/keepalive.js), which
# prevents the spin-down — but a self-ping cannot WAKE a service that is
# already asleep, and it dies with the process on every redeploy.
#
# This workflow is the external layer: GitHub's scheduler requests the
# service from the outside, so the service wakes even after a spin-down.
# Render's own docs recommend an external uptime monitor for exactly this
# reason. Add cron-job.org / UptimeRobot as a third layer if you want
# redundancy.
#
# Setup: add a repository secret
#   SELF_URL = https://your-service.onrender.com
# (Settings -> Secrets and variables -> Actions -> New repository secret)

on:
  schedule:
    # Every 10 minutes — safely inside Render's 15 minute idle window.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the service
        env:
          SELF_URL: ${{ secrets.SELF_URL }}
        run: |
          if [ -z "$SELF_URL" ]; then
            echo "SELF_URL secret is not set — nothing to ping."
            exit 0
          fi
          url="${SELF_URL%/}/health"
          echo "Pinging $url"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)"
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Service did not answer 200 (got $code) — it may be asleep or booting."
            exit 0
          fi
