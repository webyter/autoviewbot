name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci once the lockfile is regenerated (see lockfile job); until then
      # npm install re-resolves, matching what the Dockerfile already does.
      - run: npm install --no-audit --no-fund
      - run: node test/smoke.js

  # Regenerates package-lock.json against the manifest and commits the result.
  # Fixes audit M13: the lock had drifted (baileys rc13 vs rc14, axios,
  # express-rate-limit) and there is no npm in the authoring environment to
  # regenerate it. Run manually or it fires on manifest changes.
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --package-lock-only --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "lockfile already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate package-lock.json (audit M13)"
            git push
          fi
