<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#f4f8f5">
  <link rel="icon" type="image/svg+xml" href="/brand.svg">
  <meta name="description" content="Create your Autoviewer account.">
  <title>Create account — Autoviewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/register.js" defer></script>
  <script src="/no-zoom.js" defer></script>
</head>
<body>
  <section class="auth-screen">
    <div class="auth-card">
      <a class="brand brand-auth" href="/" aria-label="Autoviewer sign in">
        <img class="brand-mark" src="/brand.svg" alt="" aria-hidden="true">
        <span>Autoviewer</span>
      </a>
      <span class="auth-kicker"><span></span> GET STARTED</span>
      <h1>A little more<br>room to breathe.</h1>
      <p class="auth-copy">Create your private Autoviewer workspace.</p>

      <form id="register-form" class="auth-fields">
        <label for="register-username">Username</label>
        <input id="register-username" name="username" type="text" autocomplete="username" minlength="2" maxlength="20" pattern="[A-Za-z0-9]{2,20}" placeholder="Choose a username (2-20 alphanumeric characters)" required>
        <label for="register-password">Password</label>
        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="6" maxlength="256" placeholder="At least 6 characters" required>
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="6" maxlength="256" placeholder="Re-enter your password" required>
        <label for="register-invite">Invite code</label>
        <input id="register-invite" name="invite" type="text" autocomplete="off" placeholder="Paste your invite token">
        <button id="register-submit" class="button button-primary button-wide" type="submit">Create account</button>
        <a id="register-contact-admin" class="button button-outline button-wide contact-admin-btn" href="#" target="_blank" rel="noopener noreferrer" hidden>
          <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
          <span>Need an invite? Contact Admin on WhatsApp</span>
        </a>
        <p id="register-error" class="form-message" role="alert" hidden></p>
      </form>
      <div class="auth-foot"><span class="secure-dot"></span><a href="/">Already have an account? Sign in</a></div>
    </div>
  </section>
</body>
</html>
