app = "autoviewbot"

kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "session_data"
  destination = "/app/session"
