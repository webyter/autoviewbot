# Auto-generated by scripts/render-config.js  (npm run render:init)
# Re-generate and commit after changing deploy settings.
services:
  - type: web
    name: autoviewer-platform
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --omit=dev || npm install --omit=dev
    startCommand: node autoviewer.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: NODE_ENV
        value: production
      # Render serves HTTPS -> the session cookie must be secure.
      - key: COOKIE_SECURE
        value: "true"
      # Render sets X-Forwarded-Proto; trust one proxy hop.
      - key: TRUST_PROXY
        value: "1"
      # Keep-alive: pings this URL every ~N minutes so the free
      # service never hits Render's 15 minute idle window.
      - key: KEEPALIVE_INTERVAL_MIN
        value: "9"
      # Your service URL (https://<service>.onrender.com). Optional:
      # keep-alive works without it (the platform URL is detected),
      # but invite links need it.
      - key: PUBLIC_URL
        sync: false
      # Secrets — set these in the Render dashboard, never in git.
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USERNAMES
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: ADMIN_CONTACT
        value: "233531556024"

# NOTE: Render Free has an EPHEMERAL filesystem. The WhatsApp session
# and the user database are lost on every spin-down/restart/redeploy —
# attach a persistent disk and point SESSION_DIR at the mount path, or
# run the bot on a VPS (see deploy/autoviewer.service).
#
# Also set the GitHub secret SELF_URL = https://<service>.onrender.com
# so .github/workflows/keep-alive.yml can wake the service.