services:
  - type: web
    name: autoviewer-platform
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node autoviewer.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
      - key: ADMIN_USERNAMES
        # Set your own admin username(s) here. A fixed value shipped in the
        # blueprint handed platform admin to whoever registered that name.
        sync: false
      - key: ADMIN_CONTACT
        value: 233531556024
      - key: INVITE_CODE
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
